name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: |
          python -m pip install "numpy>=1.24" "mypy==1.18.2" "ruff==0.16.0"
          python -m pip install --no-deps -e .
      - name: Check types
        run: python -m mypy
      - name: Lint first-party sources
        run: ruff check --exclude "*.ipynb" src/ct_pathology tests/test_archive_utils.py tests/test_data_models.py
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
