[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-pathology-screening"
version = "1.1.0"
description = "Research pipeline for pathology screening in chest CT volumes"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "ilyascw" },
]
dependencies = [
  "beartype>=0.22",
  "catboost>=1.2.2",
  "einops>=0.7.0",
  "fastapi>=0.119.0",
  "ftfy>=6.3.0",
  "monai>=1.5.0",
  "nibabel>=5.1.0",
  "numpy>=1.24.0",
  "openpyxl>=3.1.0",
  "pandas>=2.1.0",
  "pillow>=10.0.0",
  "pydicom>=2.4.0",
  "python-multipart>=0.0.20",
  "regex>=2025.9.0",
  "scikit-learn>=1.3.0",
  "SimpleITK>=2.3.0",
  "torch>=2.9.0",
  "torchvision>=0.24.0",
  "tqdm>=4.67.0",
  "transformers>=4.35.0",
  "uvicorn>=0.38.0",
  "vector-quantize-pytorch==1.1.2",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "ruff==0.16.0",
]
research = [
  "accelerate>=0.24.0",
  "graphviz>=0.21",
  "jupyterlab>=4.0",
  "matplotlib>=3.10.0",
  "nltk>=3.9.0",
  "opencv-python>=4.8.0",
  "optuna>=4.0",
  "plotly>=6.3.0",
  "seaborn>=0.13.0",
  "sentencepiece>=0.2.0",
]

[project.scripts]
ct-pathology = "ct_pathology.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "ct_clip*",
  "ct_pathology*",
  "transformer_maskgit*",
]
namespaces = true

[tool.setuptools.package-data]
ct_pathology = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = [
  "src/ct_pathology",
  "tests/test_archive_utils.py",
  "tests/test_data_models.py",
]
exclude = [
  ".*\\.ipynb$",
]
ignore_missing_imports = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "ct_clip.*",
  "transformer_maskgit.*",
]
follow_imports = "skip"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",  # FastAPI dependency injection uses calls in defaults by design.
  "E501",  # Formatting is enforced separately; long medical messages stay readable.
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E501", "F541", "I001", "UP006"]
