services:
  ct-pathology-api:
    platform: linux/amd64
    build:
      context: .
    image: ct-pathology-api:local
    environment:
      CT_MODELS_DIR: /app/models
      CT_DEVICE: ${CT_DEVICE:-cuda}
      CT_MAX_WORKERS: ${CT_MAX_WORKERS:-1}
      CT_MAX_UPLOAD_MB: ${CT_MAX_UPLOAD_MB:-10240}
      CT_LOG_LEVEL: ${CT_LOG_LEVEL:-INFO}
      CT_API_TMP_DIR: /tmp/ct_api
      HF_HOME: /opt/hf_cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-4}
      TOKENIZERS_PARALLELISM: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./runtime_tmp:/tmp/ct_api
      - ./hf_cache:/opt/hf_cache
    gpus: all
    shm_size: "8gb"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
