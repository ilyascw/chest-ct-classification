version: "3.9"

services:
  ct-pathology-api:
    image: ct-pathology-api:2  # Используем загруженный образ напрямую
    container_name: ct-pathology-api
    
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    
    runtime: nvidia
    
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/opt/hf_cache
      - TRANSFORMERS_CACHE=/opt/hf_cache
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - TOKENIZERS_PARALLELISM=false
      - UVICORN_WORKERS=1
    
    ports:
      - "8000:8000"
    
    volumes:
      - ./models:/app/models:ro
      - ./runtime_tmp:/tmp/ct_api
      - ./hf_cache:/opt/hf_cache
    
    shm_size: "8g"
    
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    
    restart: unless-stopped
